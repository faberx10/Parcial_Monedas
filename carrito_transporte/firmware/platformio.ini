; Carrito de transporte - Sistema de Logística de Monedas Inteligentes (Grupo 3)
;
;  esp32dev -> carrito real (la ESP32 crea la red WiFi "Carrito_G3")
;  wokwi    -> simulación en Wokwi para VS Code (se conecta a la red virtual Wokwi-GUEST)

[platformio]
default_envs = esp32dev

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

[env:esp32dev]

[env:wokwi]
build_flags = -DWOKWI_SIM
