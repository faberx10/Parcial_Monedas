# Simulación en Wokwi para VS Code
# 1) Compilar el entorno "wokwi" de PlatformIO   2) F1 -> "Wokwi: Start Simulator"
[wokwi]
version = 1
firmware = '.pio/build/wokwi/firmware.bin'
elf = '.pio/build/wokwi/firmware.elf'

# Reenvía el servidor web de la ESP32 simulada al PC: abrir http://localhost:8180
[[net.forward]]
from = "localhost:8180"
to = "target:80"
