polyline points="300,300 274,300" fill="none" stroke="#111827" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><text x="308" y="305" font-size="15" text-anchor="start" font-weight="bold" fill="#111827">VIN (USB)</text><polyline points="300,470 274,470" fill="none" stroke="#111827" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><text x="308" y="475" font-size="15" text-anchor="start" font-weight="bold" fill="#111827">GND</text><polyline points="274,300 170,300 170,330" fill="none" stroke="#111827" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="170,330 170,365.0" fill="none" stroke="#111827" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><line x1="144" y1="365.0" x2="196" y2="365.0" stroke="#111827" stroke-width="2.4"/><line x1="156" y1="373.0" x2="184" y2="373.0" stroke="#111827" stroke-width="4"/><line x1="144" y1="385.0" x2="196" y2="385.0" stroke="#111827" stroke-width="2.4"/><line x1="156" y1="393.0" x2="184" y2="393.0" stroke="#111827" stroke-width="4"/><polyline points="170,393.0 170,440" fill="none" stroke="#111827" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><text x="136" y="365.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#111827">+</text><text x="126" y="371.0" font-size="14" text-anchor="end" font-weight="normal" fill="#111827">BT2</text><text x="126" y="389.0" font-size="14" text-anchor="end" font-weight="normal" fill="#111827">Power bank</text><text x="126" y="407.0" font-size="14" text-anchor="end" font-weight="normal" fill="#111827">5 V (USB)</text><polyline points="170,440 170,470 274,470" fill="none" stroke="#111827" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><rect x="40" y="910" width="720" height="130" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/><text x="56" y="938" font-size="14" text-anchor="start" font-weight="bold" fill="#111827">Notas</text><text x="56" y="962" font-size="13" text-anchor="start" font-weight="normal" fill="#111827">1. Jumpers ENA y ENB del L298N retirados: la velocidad se controla por PWM desde D13 y D32.</text><text x="56" y="986" font-size="13" text-anchor="start" font-weight="normal" fill="#111827">2. Los dos motores de cada lado se conectan en paralelo a la misma salida del puente H.</text><text x="56" y="1010" font-size="13" text-anchor="start" font-weight="normal" fill="#111827">3. La ESP32 se alimenta aparte (power bank) para evitar reinicios por caídas de tensión de los motores.</text><text x="56" y="1034" font-size="13" text-anchor="start" font-weight="normal" fill="#111827">4. Sin interruptor: conectar / desconectar J1 enciende y apaga la etapa de potencia.</text></svg>